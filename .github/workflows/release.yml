# À chaque modification poussée sur la branche principale : tests, fabrication d'IcueLite.exe
# et publication d'une nouvelle version. IcueLite la détecte et propose de l'installer.
name: Nouvelle version

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Numéro de version
        id: v
        run: python tools/stamp_version.py

      - name: Modules
        run: python -m pip install --upgrade pyinstaller -r requirements.txt

      - name: Tests
        shell: bash
        run: |
          # en cas d'échec, le détail est aussi remonté en annotation (visible sur la page du build)
          python -m unittest discover -s tests 2> tests.log && exit 0
          cat tests.log
          python -c "import sys; print('::error title=Tests::' + open('tests.log', encoding='utf-8', errors='replace').read()[-3000:].replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
          exit 1

      - name: Fabrication d'IcueLite.exe
        run: |
          python -c "from icuelite import logo; logo.save_ico('IcueLite.ico'); logo.save_ico('icuelite/assets/IcueLite.ico')"
          python -m PyInstaller --noconfirm --onefile --windowed --collect-data customtkinter --add-data "icuelite\assets;icuelite\assets" --icon IcueLite.ico --version-file version_info.txt --name IcueLite IcueLite.pyw

      - name: Pack (version script)
        run: python tools/make_pack.py IcueLite-pack.zip

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release create "v${{ steps.v.outputs.version }}" dist/IcueLite.exe IcueLite-pack.zip \
            --title "IcueLite ${{ steps.v.outputs.version }}" --notes-file notes.txt --latest
